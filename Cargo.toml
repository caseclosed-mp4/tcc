[workspace]
resolver = "2"
members = [
    "modules/types",
    "modules/dag",
    "modules/inference",
    "modules/trial",
    "modules/privacy",
    "modules/network",
    "modules/query",
    "modules/cli",
    "tests",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/caseclosed-mp4/tcc"
authors = ["The Causal Commons Contributors"]
description = "A decentralized, permissionless evidence engine that runs randomized experiments and maintains a public causal graph."

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rand = "0.8"
rand_distr = "0.4"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "1"

tcc-types = { path = "modules/types" }
tcc-dag = { path = "modules/dag" }
tcc-inference = { path = "modules/inference" }
tcc-trial = { path = "modules/trial" }
tcc-privacy = { path = "modules/privacy" }
tcc-network = { path = "modules/network" }
tcc-query = { path = "modules/query" }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
panic = "abort"
